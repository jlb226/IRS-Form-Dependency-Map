<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IRS Form Dependency Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a working map on the left (layered left-to-right: source documents → worksheets → the return), a reading panel on the right that explains the selected form. */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#15191d; --muted:#5b636b; --rule:#d6dad4; --grid:#e1e4de;
  --accent:#c22a26;   /* dropout-red, the ink of W-2 Copy A */
  --up:#1f5ea6;       /* forms that feed the selection */
  --edge:#a9b0aa; --tabtext:#ffffff;
  --c-core:#232c38; --c-ind:#1d7468; --c-info:#2b5f9e; --c-biz:#a35e17; --c-pay:#6a4d9e; --c-intl:#5f6e16; --c-est:#963d6b; --c-adm:#6b727b;
  --f-num:"Archivo Narrow","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111315; --surface:#1a1d20; --ink:#e6e8e4; --muted:#9ba2a8; --rule:#30353a; --grid:#1d2124;
  --accent:#ff6f61; --up:#71aefc; --edge:#4c5359; --tabtext:#111315;
  --c-core:#c9d3df; --c-ind:#5cc3b2; --c-info:#7fb0ec; --c-biz:#e9a35b; --c-pay:#b79cf0; --c-intl:#b8c95a; --c-est:#ea8fbd; --c-adm:#a7aeb6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111315; --surface:#1a1d20; --ink:#e6e8e4; --muted:#9ba2a8; --rule:#30353a; --grid:#1d2124;
  --accent:#ff6f61; --up:#71aefc; --edge:#4c5359; --tabtext:#111315;
  --c-core:#c9d3df; --c-ind:#5cc3b2; --c-info:#7fb0ec; --c-biz:#e9a35b; --c-pay:#b79cf0; --c-intl:#b8c95a; --c-est:#ea8fbd; --c-adm:#a7aeb6;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;display:flex;flex-direction:column;min-height:100%}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:861px){html,body{height:100%}body{overflow:hidden}}

header{padding-block:16px 10px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-num);font-weight:700;font-size:28px;line-height:1.05;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
h1 b{color:var(--accent);font-weight:700}
.stats{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding-block:4px 12px}
.search{position:relative;flex:1 1 240px;max-width:360px;min-width:0}
.search input{width:100%;font:inherit;font-size:14px;padding:8px 10px 8px 32px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink)}
.search input:focus{outline:2px solid var(--up);outline-offset:1px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);fill:none}
.results{position:absolute;z-index:20;top:calc(100% + 4px);left:0;right:0;background:var(--surface);border:1px solid var(--rule);border-radius:6px;max-height:320px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:4px}
.results button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;padding:6px 8px;border-radius:4px;color:var(--ink);font:inherit;font-size:13px;cursor:pointer;align-items:baseline}
.results button:hover,.results button.on{background:var(--grid)}
.results .n{font-family:var(--f-num);font-weight:700;min-width:9ch;white-space:nowrap}
.results .t{color:var(--muted);min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;padding:4px 9px 4px 7px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.chip[aria-pressed="false"]{color:var(--muted);background:transparent;text-decoration:line-through}
.chip[aria-pressed="false"] i{opacity:.35}
.chip:focus-visible,.seg button:focus-visible,.zoom button:focus-visible,.link:focus-visible,.pick:focus-visible{outline:2px solid var(--up);outline-offset:2px}

.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-size:12px;border:0;background:none;color:var(--muted);padding:5px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.tog{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--ink);cursor:pointer}
.tog input{accent-color:var(--accent)}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;padding-bottom:16px}
.map{position:relative;min-height:0;min-width:0;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background-color:var(--surface);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px);background-size:100% 22px;touch-action:none;cursor:grab}
.map.drag{cursor:grabbing}
#svg{width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.panel{min-height:0;overflow-y:auto;border:1px solid var(--rule);border-radius:8px;background:var(--surface);padding:18px 18px 22px}

@media (max-width:860px){
  main{grid-template-columns:1fr}
  .map{height:62vh;min-height:380px}
  .ctl{margin-left:0}
}

/* svg */
.edge{fill:none;stroke:var(--edge);stroke-width:1.15;marker-end:url(#ar)}
.edge.p{stroke-dasharray:4 3}
.edge.up{stroke:var(--up);stroke-width:1.9;marker-end:url(#ar-up)}
.edge.down{stroke:var(--accent);stroke-width:1.9;marker-end:url(#ar-down)}
#ar path{fill:var(--edge)} #ar-up path{fill:var(--up)} #ar-down path{fill:var(--accent)}
.node{cursor:pointer}
.node .box{fill:var(--surface);stroke:var(--rule);stroke-width:1}
.node:hover .box{stroke:var(--muted)}
.node:focus{outline:none}
.node:focus-visible .box{stroke:var(--up);stroke-width:2}
.node .tab{fill:var(--c-core)}
.node .kind{font-family:var(--f-mono);font-size:7.5px;letter-spacing:.06em;fill:var(--tabtext);opacity:.85}
.node .num{font-family:var(--f-num);font-weight:700;font-size:14px;fill:var(--tabtext)}
.node .ttl{font-family:var(--f-body);font-size:10.5px;fill:var(--ink)}
.node.sel .box{stroke:var(--accent);stroke-width:2.5}
.node.up .box{stroke:var(--up);stroke-width:1.6}
.node.down .box{stroke:var(--accent);stroke-width:1.6}
.has-sel .node:not(.sel):not(.up):not(.down){opacity:.28}
.has-sel .edge:not(.up):not(.down){opacity:.14}
.cat-core .tab{fill:var(--c-core)} .cat-ind .tab{fill:var(--c-ind)} .cat-info .tab{fill:var(--c-info)} .cat-biz .tab{fill:var(--c-biz)}
.cat-pay .tab{fill:var(--c-pay)} .cat-intl .tab{fill:var(--c-intl)} .cat-est .tab{fill:var(--c-est)} .cat-adm .tab{fill:var(--c-adm)}
.colhd{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;fill:var(--muted);text-transform:uppercase}

.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--surface)}
.zoom button{width:34px;height:32px;border:0;background:none;color:var(--ink);font:600 16px/1 var(--f-body);cursor:pointer}
.zoom button+button{border-top:1px solid var(--rule)}
.zoom button:hover{background:var(--grid)}
.legend{position:absolute;left:10px;bottom:10px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:7px 10px;font-size:11px;color:var(--muted);display:grid;gap:3px;max-width:calc(100% - 70px)}
.legend span{display:flex;align-items:center;gap:7px}
.legend svg{width:26px;height:8px;flex:none}
.empty-map{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:13px;pointer-events:none}

/* panel */
.p-kind{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.p-kind i{width:9px;height:9px;border-radius:2px;display:inline-block}
.p-num{font-family:var(--f-num);font-weight:700;font-size:40px;line-height:1;margin:6px 0 4px;letter-spacing:-.01em}
.p-title{font-size:16px;font-weight:600;line-height:1.35;margin:0 0 10px;text-wrap:balance}
.p-note{font-size:13px;color:var(--muted);margin:0 0 12px}
.link{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--up);text-decoration:none;border-bottom:1px solid currentColor;padding-bottom:1px}
.p-sec{margin-top:20px}
.p-sec h3{font-size:11px;font-family:var(--f-mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;display:flex;align-items:center;gap:8px;color:var(--muted)}
.p-sec h3 em{font-style:normal;display:inline-block;width:14px;height:3px;border-radius:2px}
.p-sec h3 .ct{margin-left:auto;font-variant-numeric:tabular-nums}
.rel{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rel button{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;width:100%;text-align:left;background:none;border:0;border-radius:5px;padding:6px 6px;color:var(--ink);font:inherit;cursor:pointer}
.rel button:hover{background:var(--grid)}
.rel .n{font-family:var(--f-num);font-weight:700;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.rel .n i{width:8px;height:8px;border-radius:2px}
.rel .t{font-size:12.5px;color:var(--muted);min-width:0}
.rel .why{grid-column:2;font-family:var(--f-mono);font-size:11.5px;color:var(--ink);line-height:1.4}
.rel .why.p::before{content:"filing link · ";color:var(--muted)}
.none{font-size:13px;color:var(--muted);margin:0}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pick{font:inherit;font-size:12.5px;border:1px solid var(--rule);background:var(--bg);color:var(--ink);border-radius:5px;padding:5px 9px;cursor:pointer}
.pick b{font-family:var(--f-num);font-size:14px}
.intro h2{font-family:var(--f-num);font-size:22px;margin:0 0 8px}
.intro p{margin:0 0 10px;max-width:60ch;font-size:13.5px}
.src{margin-top:22px;padding-top:12px;border-top:1px solid var(--rule);font-size:12px;color:var(--muted)}
.src p{margin:0 0 6px}
@media (prefers-reduced-motion:no-preference){#vp{transition:none}}
</style>
</head>
<body>

<header class="gut">
  <div>
    <div class="eyebrow">Tax year 2025 forms · built from irs.gov Forms &amp; Instructions</div>
    <h1>IRS Form <b>Dependency</b> Map</h1>
  </div>
  <div class="stats" id="stats"></div>
</header>

<div class="toolbar gut">
  <div class="search">
    <svg viewBox="0 0 16 16" stroke-width="1.8"><circle cx="7" cy="7" r="5"></circle><path d="M11 11l3.5 3.5"></path></svg>
    <input id="q" type="search" placeholder="Find a form: 8949, Schedule C, K-1, 941…" autocomplete="off" aria-label="Find a form">
    <div class="results" id="results" hidden></div>
  </div>
  <div class="chips" id="chips" aria-label="Show categories"></div>
  <div class="ctl">
    <div class="seg" role="group" aria-label="How far to trace">
      <button id="m-direct" aria-pressed="false">Direct links</button>
      <button id="m-full" aria-pressed="true">Full chain</button>
    </div>
    <label class="tog"><input type="checkbox" id="focus" checked> Only connected forms</label>
  </div>
</div>

<main class="gut">
  <div class="map" id="map">
    <svg id="svg" aria-label="Dependency map of IRS forms">
      <defs>
        <marker id="ar" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z"></path></marker>
        <marker id="ar-up" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z"></path></marker>
        <marker id="ar-down" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8z"></path></marker>
      </defs>
      <g id="vp"></g>
    </svg>
    <div class="empty-map" id="emptyMap" hidden>No forms in the categories you turned on.</div>
    <div class="legend" aria-hidden="true">
      <span><svg viewBox="0 0 26 8"><path d="M1 4H24" stroke="var(--up)" stroke-width="2"></path></svg>Feeds the selected form</span>
      <span><svg viewBox="0 0 26 8"><path d="M1 4H24" stroke="var(--accent)" stroke-width="2"></path></svg>Selected form flows into</span>
      <span><svg viewBox="0 0 26 8"><path d="M1 4H24" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 3"></path></svg>Filing link (no amount carried)</span>
    </div>
    <div class="zoom">
      <button id="zin" aria-label="Zoom in">+</button>
      <button id="zout" aria-label="Zoom out">−</button>
      <button id="zfit" aria-label="Fit map to view" style="font-size:12px">Fit</button>
    </div>
  </div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</main>

  ["f1040sr","f1040","Same lines and schedules, larger print for filers 65+","p"],
  ["f1040","f9465","Installment plan for a balance due","p"],
  ["f1040","f1040x","Amends a filed return","p"]
];

function buildGraph(nodes, edges){
  const byId = new Map(nodes.map(n => [n[0], {id:n[0], num:n[1], parent:n[2], title:n[3], cat:n[4]}]));
  const E = edges.map((e,i) => ({i, s:e[0], t:e[1], note:e[2], p:e[3]==="p"}));
  const out = new Map(), inn = new Map();
  for (const id of byId.keys()){ out.set(id,[]); inn.set(id,[]); }
  for (const e of E){ out.get(e.s).push(e); inn.get(e.t).push(e); }
  return {byId, E, out, inn};
}

// Layered left-to-right layout: longest path, pulled right toward consumers, then barycenter ordering.
function layoutGraph(ids, edges, opts){
  const W = opts.W, H = opts.H, GX = opts.GX, GY = opts.GY;
  const set = new Set(ids);
  const es = edges.filter(e => set.has(e.s) && set.has(e.t));
  const succ = new Map(), pred = new Map(), indeg = new Map();
  for (const id of ids){ succ.set(id,[]); pred.set(id,[]); indeg.set(id,0); }
  for (const e of es){ succ.get(e.s).push(e.t); pred.get(e.t).push(e.s); indeg.set(e.t, indeg.get(e.t)+1); }
  const order = [], q = ids.filter(id => indeg.get(id)===0);
  while (q.length){ const id = q.shift(); order.push(id); for (const t of succ.get(id)){ indeg.set(t, indeg.get(t)-1); if (indeg.get(t)===0) q.push(t); } }
  if (order.length !== ids.length) throw new Error("cycle in graph");
  const rank = new Map();
  for (const id of order){ let r = 0; for (const p of pred.get(id)) r = Math.max(r, rank.get(p)+1); rank.set(id, r); }
  for (let i = order.length-1; i >= 0; i--){ const id = order[i]; const ss = succ.get(id); if (ss.length){ let m = Infinity; for (const t of ss) m = Math.min(m, rank.get(t)); rank.set(id, m-1); } }
  let minR = Infinity; for (const r of rank.values()) minR = Math.min(minR, r);
  const cols = [];
  for (const id of ids){ const r = rank.get(id)-minR; rank.set(id, r); (cols[r] ||= []).push(id); }
  for (let c = 0; c < cols.length; c++) cols[c] ||= [];
  const catIx = id => CAT_ORDER.indexOf(opts.cat(id));
  for (const col of cols) col.sort((a,b) => catIx(a)-catIx(b) || a.localeCompare(b, undefined, {numeric:true}));
  const pos = new Map();
  const setPos = () => { for (const col of cols) col.forEach((id,i) => pos.set(id, (i+0.5)/col.length)); };
  setPos();
  for (let it = 0; it < 6; it++){
    const forward = it % 2 === 0;
    const range = forward ? [...cols.keys()] : [...cols.keys()].reverse();
    for (const c of range){
      const col = cols[c];
      const bary = new Map(col.map(id => {
        const nb = forward ? pred.get(id) : succ.get(id);
        if (!nb.length) return [id, pos.get(id)];
        return [id, nb.reduce((a,n) => a + pos.get(n), 0)/nb.length];
      }));
      col.sort((a,b) => bary.get(a)-bary.get(b));
      col.forEach((id,i) => pos.set(id, (i+0.5)/col.length));
    }
  }
  const maxLen = Math.max(1, ...cols.map(c => c.length));
  const xy = new Map();
  cols.forEach((col,c) => {
    const off = (maxLen - col.length) * (H+GY) / 2;
    col.forEach((id,i) => xy.set(id, {x: c*(W+GX), y: off + i*(H+GY)}));
  });
  return {xy, es, cols, width: cols.length*(W+GX)-GX, height: maxLen*(H+GY)-GY};
}
/*ENDPURE*/

const G = buildGraph(NODES, EDGES);
const DIM = {W:214, H:42, GX:96, GY:12};
const TAB = 72;

const state = {
  sel: "sC",
  mode: "full",
  focus: true,
  cats: Object.fromEntries(CAT_ORDER.map(c => [c, true])),
  view: {k:1, tx:0, ty:0},
  L: null
};
try { const saved = JSON.parse(localStorage.getItem("irsmap.cats")||"null"); if (saved) Object.assign(state.cats, saved); } catch(e){}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const label = n => n.parent ? `Schedule ${n.num} (${n.parent})` : (n.id==="ssa1099" ? "Form SSA-1099" : `Form ${n.num}`);
const kindText = n => n.parent ? `SCH · ${n.parent}` : "FORM";
const findUrl = n => "https://www.irs.gov/forms-instructions-and-publications?find=" + encodeURIComponent(n.parent ? `${n.parent} (Schedule ${n.num})` : n.num);

function related(id, mode){
  const up = new Set(), down = new Set();
  if (!id) return {up, down};
  if (mode === "direct"){
    for (const e of G.inn.get(id)) up.add(e.s);
    for (const e of G.out.get(id)) down.add(e.t);
  } else {
    const walk = (start, adj, key, acc) => { const st = [start]; while (st.length){ const x = st.pop(); for (const e of adj.get(x)){ const y = e[key]; if (!acc.has(y)){ acc.add(y); st.push(y); } } } };
    walk(id, G.inn, "s", up); walk(id, G.out, "t", down);
  }
  up.delete(id); down.delete(id);
  return {up, down};
}

function visibleIds(){
  let ids = NODES.map(n => n[0]).filter(id => state.cats[G.byId.get(id).cat]);
  if (state.focus && state.sel){
    const {up, down} = related(state.sel, state.mode);
    ids = ids.filter(id => id === state.sel || up.has(id) || down.has(id));
    if (!ids.includes(state.sel)) ids.push(state.sel);
  }
  return ids;
}

function wrapTitle(t, n){
  const words = t.split(/\s+/), lines = [""];
  let over = false;
  for (const w of words){
    const cur = lines[lines.length-1];
    const next = cur ? cur + " " + w : w;
    if (next.length <= n) lines[lines.length-1] = next;
    else if (lines.length < 2) lines.push(w);
    else { over = true; break; }
  }
  return lines.map((l,i) => {
    if (l.length > n) return l.slice(0, n-1) + "…";
    if (i === lines.length-1 && over) return (l.length > n-1 ? l.slice(0, n-1) : l) + "…";
    return l;
  });
}

function render(fit){
  const ids = visibleIds();
  $("#emptyMap").hidden = ids.length > 0;
  const L = layoutGraph(ids, G.E, {...DIM, cat: id => G.byId.get(id).cat});
  state.L = L;
  const {W,H} = DIM;
  let s = "";
  for (const e of L.es){
    const a = L.xy.get(e.s), b = L.xy.get(e.t);
    const x1 = a.x + W, y1 = a.y + H/2, x2 = b.x - 3, y2 = b.y + H/2;
    const dx = Math.max(40, (x2-x1)*0.45);
    s += `<path class="edge${e.p?" p":""}" data-i="${e.i}" d="M${x1} ${y1}C${x1+dx} ${y1} ${x2-dx} ${y2} ${x2} ${y2}"><title>${esc(label(G.byId.get(e.s)))} → ${esc(label(G.byId.get(e.t)))}: ${esc(e.note)}</title></path>`;
  }
  for (const id of ids){
    const n = G.byId.get(id), p = L.xy.get(id);
    const lines = wrapTitle(n.title, 21);
    const ty = lines.length === 1 ? H/2 + 4 : H/2 - 2;
    s += `<g class="node cat-${n.cat}" data-id="${id}" tabindex="0" role="button" aria-label="${esc(label(n))}: ${esc(n.title)}" transform="translate(${p.x},${p.y})">`
      + `<title>${esc(label(n))} — ${esc(n.title)}</title>`
      + `<rect class="box" width="${W}" height="${H}" rx="4"></rect>`
      + `<path class="tab" d="M4 0H${TAB}V${H}H4A4 4 0 0 1 0 ${H-4}V4A4 4 0 0 1 4 0Z"></path>`
      + `<text class="kind" x="8" y="13">${esc(kindText(n))}</text>`
      + `<text class="num" x="8" y="32">${esc(n.num)}</text>`
      + lines.map((l,i) => `<text class="ttl" x="${TAB+9}" y="${ty + i*13}">${esc(l)}</text>`).join("")
      + `</g>`;
  }
  $("#vp").innerHTML = s;
  highlight();
  if (fit) fitView();
  $("#stats").textContent = `${NODES.length} forms · ${EDGES.length} links · showing ${ids.length}`;
}

function highlight(){
  const svg = $("#svg");
  const sel = state.sel;
  svg.classList.toggle("has-sel", !!sel);
  const {up, down} = related(sel, state.mode);
  for (const g of svg.querySelectorAll(".node")){
    const id = g.dataset.id;
    g.classList.toggle("sel", id === sel);
    g.classList.toggle("up", up.has(id));
    g.classList.toggle("down", down.has(id));
  }
  for (const p of svg.querySelectorAll(".edge")){
    const e = G.E[+p.dataset.i];
    let isUp = false, isDown = false;
    if (sel){
      if (state.mode === "direct"){ isUp = e.t === sel; isDown = e.s === sel; }
      else { isUp = up.has(e.s) && (e.t === sel || up.has(e.t)); isDown = down.has(e.t) && (e.s === sel || down.has(e.s)); }
    }
    p.classList.toggle("up", isUp);
    p.classList.toggle("down", isDown);
  }
  // draw highlighted edges on top of dimmed ones
  const vp = $("#vp"), firstNode = vp.querySelector(".node");
  for (const p of vp.querySelectorAll(".edge.up,.edge.down")) vp.insertBefore(p, firstNode);
  renderPanel();
}

function relList(items, dir){
  if (!items.length) return `<p class="none">${dir==="in" ? "Nothing on this map feeds this form." : "This form doesn't carry to another form on this map."}</p>`;
  return `<ul class="rel">` + items.map(e => {
    const n = G.byId.get(dir === "in" ? e.s : e.t);
    return `<li><button data-go="${n.id}"><span class="n"><i style="background:var(--c-${n.cat})"></i>${esc(label(n).replace(/^Form /,""))}</span><span class="t">${esc(n.title)}</span><span class="why${e.p?" p":""}">${esc(e.note)}</span></button></li>`;
  }).join("") + `</ul>`;
}

function renderPanel(){
  const P = $("#panel");
  const n = state.sel && G.byId.get(state.sel);
  if (!n){
    P.innerHTML = `<div class="intro"><h2>How to read the map</h2>
      <p>Each box is an IRS form or schedule. Arrows run the way amounts flow: from the statements you receive, through worksheets and schedules, into the return that gets filed.</p>
      <p>Select a form to trace what feeds it (blue) and where its numbers go (red). Dashed arrows are filing links, such as an extension or an election, where no dollar amount carries over.</p>
      <p>Start with one of these:</p></div>
      <div class="picks">${["f1040","sC","w2","k1_1065","f8949","f941","f706","f990"].map(id => { const m = G.byId.get(id); return `<button class="pick" data-go="${id}"><b>${esc(m.parent ? "Sch. "+m.num : m.num)}</b>${m.parent ? " ("+esc(m.parent)+")" : ""}</button>`; }).join("")}</div>
      ${sourceNote()}`;
    return;
  }
  const ins = G.inn.get(n.id), outs = G.out.get(n.id);
  const {up, down} = related(n.id, "full");
  P.innerHTML = `
    <div class="p-kind"><i style="background:var(--c-${n.cat})"></i>${esc(CATS[n.cat].label)}</div>
    <div class="p-num">${esc(n.parent ? "Schedule " + n.num : n.num)}</div>
    <h2 class="p-title">${n.parent ? `<span style="color:var(--muted);font-weight:500">Form ${esc(n.parent)} · </span>` : ""}${esc(n.title)}</h2>
    <p class="p-note">${up.size} form${up.size===1?"":"s"} upstream · ${down.size} downstream across the full chain.</p>
    <a class="link" href="${findUrl(n)}" target="_blank" rel="noopener">Find ${esc(label(n))} on IRS.gov ↗</a>
    <div class="p-sec"><h3><em style="background:var(--accent)"></em>Flows into<span class="ct">${outs.length}</span></h3>${relList(outs,"out")}</div>
    <div class="p-sec"><h3><em style="background:var(--up)"></em>Draws from<span class="ct">${ins.length}</span></h3>${relList(ins,"in")}</div>
    ${sourceNote()}`;
}
function sourceNote(){
  return `<div class="src"><p>Form list from irs.gov Forms &amp; Instructions, which lists 3,142 current products. This map covers the forms that pass amounts to one another; publications, translations and stand-alone notices are left out.</p><p>Line references follow the 2025 forms and their instructions. Check the current instructions before relying on a line number.</p></div>`;
}

function select(id, opts = {}){
  state.sel = id;
  if (state.focus) render(true); else highlight();
  if (id && opts.center) centerOn(id);
}

/* pan & zoom */
function applyView(){ const v = state.view; $("#vp").setAttribute("transform", `translate(${v.tx},${v.ty}) scale(${v.k})`); }
function fitView(){
  const L = state.L, m = $("#map").getBoundingClientRect();
  if (!L || !m.width) return;
  const pad = 40, padB = 90;
  const k = Math.min((m.width - pad*2)/Math.max(L.width,1), (m.height - pad - padB)/Math.max(L.height,1), 1.1);
  state.view = {k, tx: (m.width - L.width*k)/2, ty: pad + (m.height - pad - padB - L.height*k)/2};
  applyView();
}
function zoomAt(px, py, f){
  const v = state.view; const k = Math.min(3, Math.max(0.08, v.k*f)); const r = k/v.k;
  v.tx = px - (px - v.tx)*r; v.ty = py - (py - v.ty)*r; v.k = k; applyView();
}
function centerOn(id){
  const p = state.L && state.L.xy.get(id); if (!p) return;
  const m = $("#map").getBoundingClientRect(); const v = state.view;
  v.k = Math.max(v.k, 0.75);
  v.tx = m.width/2 - (p.x + DIM.W/2)*v.k; v.ty = m.height/2 - (p.y + DIM.H/2)*v.k; applyView();
}

const mapEl = $("#map");
const pointers = new Map();
let drag = null, pinch = null;
mapEl.addEventListener("pointerdown", e => {
  if (e.target.closest(".zoom,.legend")) return;
  mapEl.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pointers.size === 1){
    drag = {x:e.clientX, y:e.clientY, tx:state.view.tx, ty:state.view.ty, moved:0, target:e.target.closest(".node")};
  } else if (pointers.size === 2){
    const [a,b] = [...pointers.values()];
    pinch = {d: Math.hypot(a.x-b.x, a.y-b.y)}; drag = null;
  }
});
mapEl.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (pinch && pointers.size === 2){
    const [a,b] = [...pointers.values()]; const d = Math.hypot(a.x-b.x, a.y-b.y);
    const r = mapEl.getBoundingClientRect();
    zoomAt((a.x+b.x)/2 - r.left, (a.y+b.y)/2 - r.top, d/pinch.d); pinch.d = d;
  } else if (drag){
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.moved = Math.max(drag.moved, Math.hypot(dx,dy));
    if (drag.moved > 4){ mapEl.classList.add("drag"); state.view.tx = drag.tx + dx; state.view.ty = drag.ty + dy; applyView(); }
  }
});
function endPointer(e){
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (drag && drag.moved <= 4 && e.type === "pointerup"){
    if (drag.target) select(drag.target.dataset.id);
    else if (!state.focus) select(null);
  }
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0){ drag = null; mapEl.classList.remove("drag"); }
}
mapEl.addEventListener("pointerup", endPointer);
mapEl.addEventListener("pointercancel", endPointer);
mapEl.addEventListener("wheel", e => {
  e.preventDefault(); const r = mapEl.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY*0.0016));
}, {passive:false});
$("#svg").addEventListener("keydown", e => {
  const g = e.target.closest && e.target.closest(".node");
  if (g && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); select(g.dataset.id); }
});
$("#zin").onclick = () => { const r = mapEl.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 1.25); };
$("#zout").onclick = () => { const r = mapEl.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, 0.8); };
$("#zfit").onclick = fitView;

/* panel links */
$("#panel").addEventListener("click", e => {
  const b = e.target.closest("[data-go]"); if (!b) return;
  select(b.dataset.go, {center: !state.focus});
});

/* category chips */
function renderChips(){
  $("#chips").innerHTML = CAT_ORDER.map(c => `<button class="chip" data-cat="${c}" aria-pressed="${state.cats[c]}"><i style="background:var(--c-${c})"></i>${esc(CATS[c].label)}</button>`).join("");
}
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const c = b.dataset.cat; state.cats[c] = !state.cats[c];
  b.setAttribute("aria-pressed", state.cats[c]);
  try { localStorage.setItem("irsmap.cats", JSON.stringify(state.cats)); } catch(err){}
  render(true);
});

/* mode + focus */
function setMode(m){
  state.mode = m;
  $("#m-direct").setAttribute("aria-pressed", m === "direct");
  $("#m-full").setAttribute("aria-pressed", m === "full");
  if (state.focus) render(true); else highlight();
}
$("#m-direct").onclick = () => setMode("direct");
$("#m-full").onclick = () => setMode("full");
$("#focus").onchange = e => { state.focus = e.target.checked; render(true); };

/* search */
const q = $("#q"), res = $("#results");
let hits = [], hi = 0;
function norm(s){ return s.toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
const INDEX = [...G.byId.values()].map(n => ({n, key: norm(`${label(n)} ${n.num} ${n.parent ? "sch schedule "+n.num+" "+n.parent : ""} ${n.title}`)}));
function search(){
  const t = norm(q.value);
  if (!t){ res.hidden = true; return; }
  const terms = t.split(" ");
  hits = INDEX.filter(x => terms.every(w => x.key.includes(w)))
    .sort((a,b) => (norm(b.n.num) === t) - (norm(a.n.num) === t) || a.key.length - b.key.length).slice(0, 14).map(x => x.n);
  hi = 0;
  res.innerHTML = hits.length ? hits.map((n,i) => `<button data-id="${n.id}" class="${i===0?"on":""}"><span class="n">${esc(label(n).replace(/^Form /,""))}</span><span class="t">${esc(n.title)}</span></button>`).join("") : `<div style="padding:8px;color:var(--muted);font-size:13px">No form on the map matches “${esc(q.value)}”.</div>`;
  res.hidden = false;
}
function pick(id){
  res.hidden = true; q.value = ""; q.blur();
  const n = G.byId.get(id);
  if (!state.cats[n.cat]){ state.cats[n.cat] = true; renderChips(); }
  select(id, {center: true});
  if (!state.focus){ render(false); centerOn(id); }
}
q.addEventListener("input", search);
q.addEventListener("keydown", e => {
  if (res.hidden || !hits.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp"){
    e.preventDefault(); hi = (hi + (e.key === "ArrowDown" ? 1 : hits.length-1)) % hits.length;
    res.querySelectorAll("button").forEach((b,i) => b.classList.toggle("on", i === hi));
  } else if (e.key === "Enter"){ e.preventDefault(); pick(hits[hi].id); }
  else if (e.key === "Escape"){ res.hidden = true; }
});
res.addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) pick(b.dataset.id); });
document.addEventListener("pointerdown", e => { if (!e.target.closest(".search")) res.hidden = true; });

window.addEventListener("resize", () => fitView());
renderChips();
$("#focus").checked = state.focus;
render(true);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitView());
</script>
</body>
</html>
